openapi: 3.0.4
info:
  title: BIN Lookup
  description: >-
    BIN Lookup checks the first six digits of a payment card to return card
    brand, type, issuing bank, and country of issuance. Pass a card BIN to
    inspect whether incoming cards are debit, credit, or prepaid.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/binlookup:
    get:
      summary: BIN Lookup
      description: Lookup credit card information based on the BIN
      operationId: binlookup
      parameters:
        - name: bin
          in: query
          schema:
            type: string
          required: true
          description: The first six digits of the credit card number (BIN)
          example: '448590'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  bin: '448590'
                  brand: VISA
                  type: CREDIT
                  category: PURCHASING
                  country: United States
                  issuer:
                    name: JPMORGAN CHASE BANK, N.A.
                    country: United States
                    phone: 1-800-432-3117
                    website: www.chase.com
                  location:
                    latitude: '37.0902'
                    longitude: '-95.7129'
                    alpha2: US
                    alpha3: USA
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
