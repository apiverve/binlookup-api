name: apiverve_binlookup
description: "BIN Lookup is a BIN checker API: send the first 6 to 8 digits of a payment card and get the card brand, type (debit or credit), issuing bank and country of issuance back as JSON. Check incoming cards at checkout before you charge them."
version: 1.2.3
homepage: https://apiverve.com/marketplace/binlookup?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/binlookup-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
